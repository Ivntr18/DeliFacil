[versions]

#android-sdk
android-compileSdk = "34"
android-minSdk = "26"
android-targetSdk = "33"
jvm = "17"

androidPlugin = "8.1.1"
kotlin = "1.9.10"

composeBom = "2023.09.00"
composeCompiler = "1.5.3"
composeNavigation = "2.7.2"

#deps

accompanist = "0.30.1"
androidxActivityCompose = "1.7.2"
androidxAutofill = "1.1.0"
androidxBrowser = "1.0.0"
androidxCamera = "1.2.3"
androidxConstraintCompose = "1.0.1"
androidxCore = "1.10.1"
androidxDatastore = "1.0.0"
androidxEspresso = "3.5.1"
androidxJunit = "1.1.5"
androidxLifecycle = "2.6.1"
androidxPoolingContainer = "1.0.0"
androidxSplashScreen = "1.0.1"
apptentive = "6.0.0"
azureMsal = "3.0.2"
coil = "2.4.0"
firebaseBoM = "32.1.1"
firebaseCrashlyticsPlugin = "2.9.1"
firebasePerformancePlugin = "1.4.2"
googleLocation = "21.0.1"
googleMLKit = "17.1.0"
googleMaps = "18.1.0"
googlePlaces = "3.1.0"
googleServices = "4.3.14"
gpsAdsId = "17.1.0"
gradleVersionPlugin = "0.46.0"
hamcrest = "2.2"
junit = "4.13.2"
junit5 = "5.9.0"
koin = "3.4.3"
kotlinCoroutines = "1.7.1"
kotlinSerialization = "1.5.1"
kotlinxDatetime = "0.4.0"
ktlintGradle = "11.3.2"
ktor = "2.3.2"
mapsCompose = "2.11.3"
mapsPlatformSecrets = "2.0.1"
materialAndroid = "1.9.0"
ok2curl = "0.8.0"
okhttp = "4.10.0"
processPhoenix = "2.1.2"
robolectric = "4.9"
salesforce = "8.0.6"
timber = "5.0.1"
timberSlf4j = "3.1"
turbine = "0.8.0"
versionCatalogUpdate = "0.7.0"
versionCode = "1"
versionName = "Apple"
zxing = "3.5.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "androidPlugin" }
android-library = { id = "com.android.library", version.ref = "androidPlugin" }
gradle-versions = { id = "com.github.ben-manes.versions", version.ref = "gradleVersionPlugin" }
java-library = { id = "java-library", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "versionCatalogUpdate" }
mapsplatform-secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "mapsPlatformSecrets" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics-plugin = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
firebase-performance-plugin = { id = "com.google.firebase.firebase-perf", version.ref = "firebasePerformancePlugin" }

[libraries]

#gradle plugins (for buildSrc)
plugin-android = { module = "com.android.tools.build:gradle", version.ref = "androidPlugin" }
plugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-ktlint = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlintGradle" }
plugin-versions = { module = "com.github.ben-manes:gradle-versions-plugin", version.ref = "gradleVersionPlugin" }

#accompanist
accompanist-navigation-animation = { module = "com.google.accompanist:accompanist-navigation-animation", version.ref = "accompanist" }
accompanist-navigation-material = { module = "com.google.accompanist:accompanist-navigation-material", version.ref = "accompanist" }
accompanist-systemuicontroller = { module = "com.google.accompanist:accompanist-systemuicontroller", version.ref = "accompanist" }
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist" }

#androidx
androidx-autofill = { module = "androidx.autofill:autofill", version.ref = "androidxAutofill" }
androidx-constraint-compose = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "androidxConstraintCompose" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDatastore" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidxSplashScreen" }

#androidx-camera
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "androidxCamera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidxCamera" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidxCamera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidxCamera" }

#androidx-testing
androidx-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxEspresso" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }

#Azure
azure-msal = { module = "com.microsoft.identity.client:msal", version.ref = "azureMsal" }


#compose
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material = { module = "androidx.compose.material:material" }
compose-navigation = { module = "androidx.navigation:navigation-compose", version.ref = "composeNavigation" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

#compose-testing
compose-ui-test-junit = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

#koin
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }

#kotlinx
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinCoroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinSerialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinSerialization" }

#ktor
ktor-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }

# Google Services
google-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "googleLocation" }
google-services-maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "mapsCompose" }
google-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "googleMaps" }
google-services-places = { module = "com.google.android.libraries.places:places", version.ref = "googlePlaces" }
google-mlkit = { module = "com.google.mlkit:barcode-scanning", version.ref = "googleMLKit" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBoM" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics-ktx" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics-ktx" }
firebase-remoteconfig = { module = "com.google.firebase:firebase-config" }
firebase-performance = { module = "com.google.firebase:firebase-perf" }

# Salesforce
salesforce = { module = "com.salesforce.marketingcloud:marketingcloudsdk", version.ref = "salesforce" }

#other
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
coil-gif = { module = "io.coil-kt:coil-gif", version.ref = "coil" }
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }
junit = { module = "junit:junit", version.ref = "junit" }
junit5 = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
material-android = { module = "com.google.android.material:material", version.ref = "materialAndroid" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-logging-curl = { module = "com.github.mrmike:ok2curl", version.ref = "ok2curl" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
timber-slf4j = { module = "com.arcao:slf4j-timber", version.ref = "timberSlf4j" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
apptentive = { module = "com.apptentive:apptentive-kit-android", version.ref = "apptentive" }
zxing = { module = "com.google.zxing:core", version.ref = "zxing" }

# testing
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

#debug
process-phoenix = { module = "com.jakewharton:process-phoenix", version.ref = "processPhoenix" }

[bundles]
androidx = ["androidx-autofill", "androidx-core", "androidx-datastore", "androidx-lifecycle-runtime"]
androidx-camera = ["androidx-camera-core", "androidx-camera-view", "androidx-camera-camera2", "androidx-camera-lifecycle"]
androidx-testing = ["androidx-espresso", "androidx-junit"]
compose = ["compose-bom", "compose-activity", "compose-foundation", "compose-material", "compose-ui", "compose-ui-tooling-preview"]
compose-feature = ["compose-foundation", "compose-material", "compose-ui", "compose-ui-tooling-preview"]
compose-debug = ["compose-ui-tooling", "compose-ui-test-manifest"]
compose-testing = ["compose-ui-test-junit"]
koin = ["koin-android", "koin-compose"]
ktor = ["ktor-auth", "ktor-core", "ktor-okhttp"]
unittest-android = ["junit", "robolectric", "hamcrest"]
